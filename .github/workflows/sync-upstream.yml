name: Sync upstream safely

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream without rewriting history
        shell: bash
        env:
          UPSTREAM_REPOSITORY: microsoft/generative-ai-for-beginners
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream main --tags

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "No new upstream commits."
            exit 0
          fi

          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          pre_tag="archive/pre-sync/${stamp}"
          post_tag="archive/post-sync/${stamp}"

          git tag -a "${pre_tag}" -m "State before upstream sync ${stamp}" HEAD
          git push origin "refs/tags/${pre_tag}"

          git merge --no-edit upstream/main

          git tag -a "${post_tag}" -m "State after upstream sync ${stamp}" HEAD
          git push origin main
          git push origin "refs/tags/${post_tag}"
